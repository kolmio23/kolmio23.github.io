<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>kolmio23</title>
    <style>
        :root {
            --bg-color: #fafafa;
            --text-color: #222;
            --disabled-text-color: #555;
            --border-color: #333;
            --surface-color: #fff;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #111;
                --text-color: #e8e8e8;
                --disabled-text-color: #bdbdbd;
                --border-color: #bdbdbd;
                --surface-color: #1c1c1c;
            }
        }
        html, body {
            margin: 0;
            height: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            font-family: "Courier New", monospace;
            color: var(--text-color);
        }
        .game {
            text-align: center;
        }
        h1 {
            margin: 0 0 1rem;
            font-size: 1.5rem;
        }
        #status {
            margin: 0 0 1rem;
            font-size: 1rem;
            min-height: 1.5rem;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1rem;
        }
        .cell {
            border: 2px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-color);
            font-size: 2rem;
            cursor: pointer;
            line-height: 1;
        }
        .cell:disabled {
            cursor: default;
            color: var(--disabled-text-color);
        }
        #reset {
            border: 2px solid var(--border-color);
            background: var(--surface-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            font-family: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="game">
        <h1>Tic Tac Toe</h1>
        <p id="status" aria-live="polite">Turn: X</p>
        <div class="board" id="board" aria-label="Tic Tac Toe board"></div>
        <button id="reset" type="button">Reset</button>
    </main>
    <script>
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const resetEl = document.getElementById('reset');
        const BOARD_CELLS = 9;

        let board = Array(BOARD_CELLS).fill('');
        let current = 'X';
        let done = false;

        const winLines = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        function winner() {
            for (const [a, b, c] of winLines) {
                if (board[a] && board[a] === board[b] && board[b] === board[c]) {
                    return board[a];
                }
            }
            return null;
        }

        function render() {
            boardEl.innerHTML = '';
            board.forEach((value, i) => {
                const btn = document.createElement('button');
                const row = Math.floor(i / 3) + 1;
                const col = (i % 3) + 1;
                btn.className = 'cell';
                btn.type = 'button';
                btn.dataset.index = String(i);
                btn.textContent = value;
                btn.disabled = done || value !== '';
                btn.setAttribute('aria-label', `Row ${row}, column ${col}, ${value ? `filled with ${value}` : 'empty'}`);
                boardEl.appendChild(btn);
            });

            const win = winner();
            if (win) {
                statusEl.textContent = `Winner: ${win}`;
                done = true;
            } else if (board.every(cell => cell !== '')) {
                statusEl.textContent = 'Draw!';
                done = true;
            } else {
                statusEl.textContent = `Turn: ${current}`;
            }
        }

        function move(i) {
            if (done || board[i]) return;
            board[i] = current;
            current = current === 'X' ? 'O' : 'X';
            render();
        }

        function resetGame() {
            board = Array(BOARD_CELLS).fill('');
            current = 'X';
            done = false;
            render();
        }

        boardEl.addEventListener('click', (event) => {
            const target = event.target;
            if (!(target instanceof HTMLButtonElement)) return;
            const rawIndex = target.dataset.index;
            if (rawIndex === undefined) return;
            const index = Number(rawIndex);
            if (Number.isNaN(index) || index < 0 || index > BOARD_CELLS - 1) return;
            move(index);
        });
        resetEl.addEventListener('click', resetGame);
        render();
    </script>
</body>
</html>
